# Pygmalion / C.R.I.S.T.A.L.L.
# Docker Compose для локальной среды (v0.3.0 «Песочница»)
# Canon v1.0 · Этический стоп-кран активен
#
# Требования:
# - Docker Desktop с WSL2
# - Node.js v20.x.x LTS
#
# Запуск:
#   docker compose up -d
#
# Остановка:
#   docker compose down
#
# Просмотр логов:
#   docker compose logs -f

services:
  # ===========================================
  # PostgreSQL — реестр ro.DAG
  # ===========================================
  postgres:
    image: postgres:15-alpine
    container_name: pygmalion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pygmalion
      POSTGRES_USER: pygmalion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pygmalion_local_2026}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=ru_RU.UTF-8 --lc-ctype=ru_RU.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - pygmalion-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pygmalion -d pygmalion"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================
  # Activepieces — оркестрация ТИУП(ч)
  # ===========================================
  activepieces:
    image: ghcr.io/activepieces/activepieces:0.24.0
    container_name: pygmalion-activepieces
    restart: unless-stopped
    environment:
      AP_API_KEY: ${AP_API_KEY:-pygmalion_ap_key_2026}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:-pygmalion_encryption_2026}
      AP_POSTGRES_DATABASE: pygmalion
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: 5432
      AP_POSTGRES_USERNAME: pygmalion
      AP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pygmalion_local_2026}
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: 6379
      AP_FRONTEND_URL: http://localhost:8080
      AP_BACKEND_URL: http://localhost:8080
      AP_TRIGGER_DEFAULT_POLL_INTERVAL: 1
      AP_EXECUTION_MODE: SANDBOXED
      AP_TEMPLATES_SOURCE_URL: https://cloud.activepieces.com/api/v1/flow-templates
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pygmalion-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const s=require('net').createConnection(3000,'localhost');s.on('connect',()=>{console.log('OK');process.exit(0);s.end();});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),5000)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # ===========================================
  # Redis — кэш для Activepieces
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: pygmalion-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pygmalion-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # pgAdmin — администрирование PostgreSQL
  # ===========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pygmalion-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pygmalion.docker}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_local_2026}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "8081:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - pygmalion-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # Nginx — раздача статического контента (песочница)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: pygmalion-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../sandbox-v0.3.0:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - activepieces
    networks:
      - pygmalion-net
    deploy:
      resources:
        limits:
          memory: 128M

# ===========================================
# Сети
# ===========================================
networks:
  pygmalion-net:
    driver: bridge

# ===========================================
# Тома для постоянного хранения
# ===========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
