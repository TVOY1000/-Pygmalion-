# Grafana datasource provisioning
# Pygmalion v0.3.2

apiVersion: 1

datasources:
  # Prometheus
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"

  # PostgreSQL (для бизнес-метрик)
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: pgbouncer:6432
    database: pygmalion
    user: pygmalion
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-pygmalion_prod_secure_2026}
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1500
