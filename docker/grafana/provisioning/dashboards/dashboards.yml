# Grafana dashboard provisioning
# Pygmalion v0.3.2

apiVersion: 1

providers:
  - name: 'Pygmalion Dashboards'
    orgId: 1
    folder: ''
    folderUid: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
