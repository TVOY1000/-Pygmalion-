name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'mvp/app/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install
        working-directory: mvp/app
        run: npm install
      
      - name: Build
        working-directory: mvp/app
        run: npm run build
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mvp/app/dist
      
      - uses: actions/deploy-pages@v4
