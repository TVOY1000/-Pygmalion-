name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mvp/app/package-lock.json

      - name: Install dependencies
        working-directory: mvp/app
        run: npm ci

      - name: Build
        working-directory: mvp/app
        run: npm run build

      - name: Validate build artifact
        working-directory: mvp/app
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -q '/src/main.jsx' dist/index.html; then
            echo 'ERROR: dist/index.html still points to source /src/main.jsx'
            exit 1
          fi
          if ! grep -q 'assets/index-' dist/index.html; then
            echo 'ERROR: dist/index.html does not include built assets/index-*.js'
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mvp/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
